server:
  port: 8090

spring:
  application:
    name: book-store-cloud-gateway

  profiles:
    active: dev

  cloud:
    loadbalancer:
      cache:
        ttl: 1s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:1234@localhost:8761/eureka
    registry-fetch-interval-seconds: 1
    disable-delta: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: ./logs

  level:
    com.netflix.discovery: ERROR
    com.netflix.eureka: ERROR